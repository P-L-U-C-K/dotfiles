<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias>
        <family>monospace</family>
        <prefer>
            <!-- 1. Your Primary UI / Nerd Font -->
            <family>UbuntuMono Nerd Font</family>

            <!-- 2. Fallback for general foreign language characters -->
            <family>Noto Sans</family>

            <!-- 3. Fallback for Chinese, Japanese, and Korean artists -->
            <family>Noto Sans CJK JP</family>

            <!-- 4. Fallback for interface UI symbols -->
            <family>FontAwesome</family>
        </prefer>
    </alias>
</fontconfig>

