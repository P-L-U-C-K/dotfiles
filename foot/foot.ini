[main]
shell=fish
font=UbuntuMono Nerd Font:pixelsize=18
pad=8x8
initial-window-size-pixels=500x300

[scrollback]
lines=2000

[colors-dark]
alpha=0.99
foreground=e0def4
background=191724

# Text colour under the cursor, then the cursor colour
cursor=e0def4 524f67

regular0=26233a
regular1=eb6f92
regular2=31748f
regular3=f6c177
regular4=9ccfd8
regular5=c4a7e7
regular6=ebbc50
regular7=e0def4

bright0=6e6a86
bright1=eb6f92
bright2=31748f
bright3=f6c177
bright4=9ccfd8
bright5=c4a7e7
bright6=ebbc50
bright7=e0def4

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
scrollback-up-line=Control+Shift+k
scrollback-down-line=Control+Shift+j
